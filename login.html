<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — Northline</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://api.fontshare.com/v2/css?f[]=general-sans@500,600,650,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="nav scrolled">
      <div class="nav-inner">
        <a class="logo" href="index.html">
          <svg class="logo-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect width="24" height="24" rx="6" fill="#2563EB" />
            <path d="M6 16V8h3.2c2.1 0 3.3 1.1 3.3 2.8 0 1.8-1.2 2.9-3.3 2.9H8.2V16H6zm2.2-4.6h.9c.8 0 1.3-.4 1.3-1.1S9.9 9.2 9.1 9.2h-.9v2.2z" fill="#fff"/>
          </svg>
          Northline
        </a>
        <nav class="nav-links">
          <a href="jobs.html">Jobs</a>
          <a href="companies.html">Companies</a>
          <a href="candidates.html">Candidates</a>
          <a href="resources.html">Resources</a>
          <a href="pricing.html">Pricing</a>
        </nav>
        <div class="nav-actions">
          <a class="btn btn-primary" href="signup.html">Sign Up</a>
          <button class="menu-toggle" aria-label="Open menu">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
        </div>
      </div>
    </header>

    <main class="auth-wrap">
      <div class="auth-card">
        <p class="eyebrow">Welcome back</p>
        <h1>Log in</h1>
        <p class="muted">Use the email on your Northline account.</p>
        <form class="auth-form">
          <div class="field">
            <label for="email">Work email</label>
            <input id="email" type="email" required placeholder="you@company.com" />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" required placeholder="••••••••" />
          </div>
          <button class="btn btn-primary btn-full" type="submit" style="margin-top: 24px">Continue</button>
        </form>
        <p class="auth-alt">New here? <a href="signup.html">Create an account</a></p>
      </div>
    </main>
    <script src="js/main.js"></script>
  </body>
</html>
